name: PR checks

# Enforces docs/BRANCHING.md: branch names, PR title == branch name, and a
# type label derived from the branch prefix. Uses only event metadata — the
# PR's code is never checked out — so pull_request_target is safe here.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  title-and-branch:
    name: PR title and branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const branch = pr.head.ref
            const title = pr.title.trim()

            // Bot branches (Dependabot) are exempt from naming rules.
            if (branch.startsWith('dependabot/')) {
              core.info(`Skipping naming checks for ${branch}`)
              return
            }

            const pattern = /^(feature|fix|hotfix|chore|docs|ci|refactor)\/[a-z0-9][a-z0-9-]*$/
            const problems = []
            if (!pattern.test(branch)) {
              problems.push(`Branch \`${branch}\` must match \`${pattern.source}\` (see docs/BRANCHING.md).`)
            }
            if (title !== branch) {
              problems.push(`PR title must equal the branch name: expected \`${branch}\`, got \`${title}\`.`)
            }
            if (problems.length) {
              core.setFailed(problems.join('\n'))
              return
            }

            const type = branch.split('/')[0]
            const label = `type: ${type}`
            const existing = pr.labels.map(l => l.name)
            const stale = existing.filter(n => n.startsWith('type: ') && n !== label)
            for (const name of stale) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name })
            }
            if (!existing.includes(label)) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [label] })
            }
            core.info(`OK: ${branch} → ${label}`)
