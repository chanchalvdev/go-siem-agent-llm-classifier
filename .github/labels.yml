# Source of truth for repository labels, synced by .github/workflows/labels.yml.
# Labels missing here are left alone (skip-delete), so manual labels survive.

# Type — set automatically from the branch prefix by the PR checks workflow.
- name: "type: feature"
  color: "1f6feb"
  description: "New capability or user-visible improvement"
- name: "type: fix"
  color: "d73a4a"
  description: "Bug fix"
- name: "type: hotfix"
  color: "b60205"
  description: "Urgent fix for a released version"
- name: "type: chore"
  color: "c5def5"
  description: "Maintenance, dependencies, tooling"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: ci"
  color: "5319e7"
  description: "Workflows and automation"
- name: "type: refactor"
  color: "fbca04"
  description: "Internal change without behaviour change"
- name: "type: security"
  color: "ee0701"
  description: "Security fix or hardening"

# Area — set automatically from changed paths by .github/labeler.yml.
- name: "area: backend"
  color: "0e8a16"
  description: "Go API, pipeline, classifier"
- name: "area: frontend"
  color: "7057ff"
  description: "React dashboard"
- name: "area: detection"
  color: "e99695"
  description: "Detection rules and engine"
- name: "area: ingestion"
  color: "006b75"
  description: "Log parsing and listeners"
- name: "area: ai"
  color: "a2eeef"
  description: "LLM classification and the investigation agent"
- name: "area: storage"
  color: "bfd4f2"
  description: "Postgres, Qdrant"
- name: "area: ci"
  color: "5319e7"
  description: "GitHub Actions and repository automation"
- name: "area: docs"
  color: "0075ca"
  description: "Documentation"
- name: "area: deps"
  color: "ededed"
  description: "Dependency updates"

# Priority — set by maintainers.
- name: "priority: critical"
  color: "b60205"
  description: "Production-impacting; fix now"
- name: "priority: high"
  color: "d93f0b"
  description: "Next in line"
- name: "priority: low"
  color: "c2e0c6"
  description: "When time allows"

# Status and community.
- name: "breaking change"
  color: "b60205"
  description: "Changes behaviour or configuration in a non-compatible way"
- name: "needs review"
  color: "fbca04"
  description: "Ready for review"
- name: "blocked"
  color: "000000"
  description: "Waiting on something outside this PR"
- name: "good first issue"
  color: "7057ff"
  description: "Small, well-defined starting point"
- name: "help wanted"
  color: "008672"
  description: "Contributions welcome"
- name: "bug"
  color: "d73a4a"
  description: "Something is not working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature request"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency update (Dependabot)"
