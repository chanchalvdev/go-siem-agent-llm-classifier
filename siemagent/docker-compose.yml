services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: siemagent
      POSTGRES_PASSWORD: siemagent
      POSTGRES_DB: siemagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siemagent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Application containers. Opt in with:
  #   docker compose --profile app up -d --build
  # LLM settings come from .env (GEMINI_API_KEY, or LLM_PROVIDER=ollama).
  api:
    profiles: [app]
    build: .
    image: ghcr.io/chanchalvdev/siemagent-api:latest
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DSN: postgres://siemagent:siemagent@postgres:5432/siemagent?sslmode=disable
      QDRANT_ADDR: qdrant:6334
      OLLAMA_URL: http://ollama:11434
      ALLOWED_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  web:
    profiles: [app]
    build: ./web
    image: ghcr.io/chanchalvdev/siemagent-web:latest
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "3000:8080"
    depends_on:
      - api

volumes:
  qdrant_data:
  postgres_data:
  ollama_data:
