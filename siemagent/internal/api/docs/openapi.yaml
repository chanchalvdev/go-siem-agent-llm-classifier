openapi: "3.0.3"
info:
  title: SIEMAgent API
  version: "1.0.0"
  description: |
    AI-powered Security Information and Event Management (SIEM) classifier.

    Parses syslog / JSON logs, evaluates Sigma detection rules, classifies
    events with an LLM (Gemini, Ollama or any OpenAI-compatible API), indexes
    them in Qdrant for semantic search, and exposes analytics.

    **Authentication:** when the server runs with `SIEM_API_KEYS`, every route
    except `/health`, `/health/ready` and `/docs` needs `Authorization: Bearer <key>`
    or `X-API-Key: <key>`.

    **Severity scale**
    | Code | Meaning |
    |------|---------|
    | P1 | Critical — active breach / ransomware / data exfil |
    | P2 | High — successful intrusion / privilege escalation |
    | P3 | Medium — failed attack attempt / anomaly |
    | P4 | Low — policy violation / reconnaissance |
    | P5 | Info — normal ops / noise |

servers:
  - url: http://localhost:8080
    description: Local dev server

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Classification
    description: Log event classification (single and streaming)
  - name: Ingestion
    description: Bulk log ingestion pipeline
  - name: Search
    description: Semantic vector search over past events
  - name: Events
    description: Stored event history
  - name: Detection
    description: Sigma detection rules
  - name: Incidents
    description: Correlated alerts and case management
  - name: Response
    description: Playbooks and approved response actions
  - name: Accounts
    description: Login sessions, users and the audit log
  - name: Analytics
    description: Event analytics
  - name: Observability
    description: Prometheus metrics

paths:
  # ── Health ────────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns immediately. Use this as the container liveness check.
      operationId: getHealth
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOK"
              example:
                status: ok

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Checks downstream dependencies with a 10-second result cache.
        Returns 503 if any dependency is unreachable.

        **Checks performed**
        - `llm` — always checked (Ping call to the configured LLM, 5 s timeout)
        - `qdrant` — only present when `QDRANT_ADDR` is configured; uses a plain TCP
          dial with a 2 s timeout
      operationId: getHealthReady
      responses:
        "200":
          description: All configured dependencies reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
              examples:
                llm_only:
                  summary: LLM ok, Qdrant not configured
                  value:
                    status: ready
                    checks:
                      llm: ok
                with_qdrant:
                  summary: LLM + Qdrant both ok
                  value:
                    status: ready
                    checks:
                      llm: ok
                      qdrant: ok
        "503":
          description: One or more dependencies unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
              examples:
                llm_down:
                  summary: LLM unreachable
                  value:
                    status: not ready
                    checks:
                      llm: "error: context deadline exceeded"
                qdrant_down:
                  summary: Qdrant unreachable
                  value:
                    status: not ready
                    checks:
                      llm: ok
                      qdrant: "error: dial tcp 127.0.0.1:6334: connect: connection refused"

  # ── Classification ────────────────────────────────────────────────────────────

  /classify:
    post:
      tags: [Classification]
      summary: Classify a single log line (legacy top-level path)
      description: Alias for `POST /api/classify`. Kept for backward compatibility.
      operationId: classifyLegacy
      requestBody:
        $ref: "#/components/requestBodies/ClassifyRequest"
      responses:
        "200":
          $ref: "#/components/responses/ClassifiedEvent"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /classify/stream:
    post:
      tags: [Classification]
      summary: Classify a log line with SSE streaming (legacy top-level path)
      description: Alias for `POST /api/classify/stream`. Kept for backward compatibility.
      operationId: classifyLogStreamLegacy
      requestBody:
        $ref: "#/components/requestBodies/ClassifyRequest"
      responses:
        "200":
          description: SSE stream — see `/api/classify/stream` for full event format
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/classify:
    post:
      tags: [Classification]
      summary: Classify a single log line
      description: |
        Parses the raw log line (auto-detecting RFC 5424 syslog, RFC 3164 syslog,
        JSON, or treating it as a raw string), then sends it to the LLM for classification.

        **Validation rules**
        - `log` is required, max 8 192 bytes
        - `format` must be `syslog`, `json`, or `auto` (default `auto`)
      operationId: classifyLog
      requestBody:
        $ref: "#/components/requestBodies/ClassifyRequest"
      responses:
        "200":
          $ref: "#/components/responses/ClassifiedEvent"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/classify/stream:
    post:
      tags: [Classification]
      summary: Classify a log line with SSE streaming
      description: |
        Same as `POST /api/classify` but streams the LLM response as
        Server-Sent Events so the client receives incremental text.

        **Event types**
        ```
        data: {"chunk":"..."}            ← incremental LLM token
        data: {"result":{...},"done":true}  ← final ClassifiedEvent + done signal
        data: {"error":"..."}           ← classification failure
        ```

        Set `Accept: text/event-stream` or let the browser handle it via `EventSource`.
      operationId: classifyLogStream
      requestBody:
        $ref: "#/components/requestBodies/ClassifyRequest"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                data: {"chunk":"{\"attack_type\":\"Brute"}

                data: {"chunk":" Force\",\"severity\":\"P2\"..."}

                data: {"result":{"attack_type":"Brute Force","severity":"P2","confidence":0.95,"iocs":["192.168.1.100"],"summary":"Multiple failed SSH login attempts.","remediation":"Block the source IP and rotate credentials.","mitre":{"tactic":"Credential Access","technique_id":"T1110.001","technique":"Password Guessing"},"event":{"raw":"<165>1 2024-01-15T10:30:00Z webserver sshd 1234 - Failed password for root from 192.168.1.100 port 22","timestamp":"2024-01-15T10:30:00Z","hostname":"webserver","app_name":"sshd","proc_id":"1234","message":"Failed password for root from 192.168.1.100 port 22","source":"syslog"},"processed_at":"2024-01-15T10:30:01Z"},"done":true}

        "400":
          $ref: "#/components/responses/ValidationError"

  # ── Ingestion ─────────────────────────────────────────────────────────────────

  /api/ingest:
    post:
      tags: [Ingestion]
      summary: Bulk ingest up to 500 log lines
      description: |
        Parses and classifies all lines using the worker pool.
        Streams chunked progress lines every 10 events, then a final summary object.

        **Progress line format (chunked)**
        ```json
        {"progress":10,"accepted":47}
        ```
        **Final response object**
        ```json
        {"accepted":47,"classified":45,"errors":2,"results":[...]}
        ```
      operationId: ingestLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
            examples:
              syslog_batch:
                summary: Batch of syslog lines
                value:
                  format: syslog
                  logs:
                    - "<165>1 2024-01-15T10:30:00Z webserver sshd 1234 - Failed password for root from 192.168.1.100 port 22"
                    - "<165>1 2024-01-15T10:30:01Z webserver sshd 1234 - Failed password for root from 192.168.1.100 port 22"
                    - "<165>1 2024-01-15T10:30:02Z webserver sshd 1234 - Accepted publickey for deploy from 10.0.0.5 port 41222"
              json_batch:
                summary: Batch of JSON log lines
                value:
                  format: json
                  logs:
                    - '{"level":"error","msg":"auth failed","time":"2024-01-15T10:30:00Z","hostname":"api-01"}'
                    - '{"level":"warn","msg":"rate limit exceeded","time":"2024-01-15T10:30:05Z","hostname":"api-01"}'
      responses:
        "200":
          description: |
            Bulk classification result streamed as chunked JSON.

            The response uses `Transfer-Encoding: chunked`. Every 10 events a
            progress line is flushed, followed by the final IngestResponse object:

            ```
            {"progress":10,"accepted":47}
            {"progress":20,"accepted":47}
            {"accepted":47,"classified":45,"errors":2,"results":[...]}
            ```
          headers:
            Transfer-Encoding:
              schema:
                type: string
                enum: [chunked]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
              example:
                accepted: 3
                classified: 3
                errors: 0
                results:
                  - attack_type: Brute Force
                    severity: P2
                    confidence: 0.95
                    iocs: ["192.168.1.100", "root"]
                    summary: Multiple failed SSH login attempts from 192.168.1.100.
                    remediation: Block the source IP and reset account credentials.
                    mitre:
                      tactic: Credential Access
                      technique_id: T1110.001
                      technique: "Password Guessing"
                    event:
                      raw: "<165>1 2024-01-15T10:30:00Z webserver sshd 1234 - Failed password for root from 192.168.1.100 port 22"
                      timestamp: "2024-01-15T10:30:00Z"
                      hostname: webserver
                      app_name: sshd
                      proc_id: "1234"
                      message: Failed password for root from 192.168.1.100 port 22
                      source: syslog
                    processed_at: "2024-01-15T10:30:01Z"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                empty_logs:
                  summary: Empty logs array
                  value:
                    error: "logs array is empty"
                too_many_logs:
                  summary: Exceeds 500 line limit
                  value:
                    error: "maximum 500 log lines per request"
                invalid_json:
                  summary: Malformed request body
                  value:
                    error: "invalid JSON body"

  # ── Search ────────────────────────────────────────────────────────────────────

  /api/search:
    get:
      tags: [Search]
      summary: Semantic search over indexed events
      description: |
        Embeds the query text with Ollama (nomic-embed-text) and performs a
        nearest-neighbour search in Qdrant.

        Returns 503 when Qdrant / Ollama are not configured.
      operationId: searchEvents
      parameters:
        - name: q
          in: query
          required: true
          description: Natural language search query
          schema:
            type: string
            minLength: 1
          example: "brute force SSH login from China"
        - name: severity
          in: query
          required: false
          description: Filter results to a single severity level
          schema:
            $ref: "#/components/schemas/Severity"
          example: P2
        - name: limit
          in: query
          required: false
          description: Maximum number of results (1–100, default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 10
      responses:
        "200":
          description: Ranked search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHit"
              example:
                - event_id: "Failed password f"
                  timestamp: "2024-01-15T10:30:01Z"
                  source: syslog
                  attack_type: Brute Force
                  severity: P2
                  summary: Multiple failed SSH login attempts from 192.168.1.100.
                  mitre_tactic: Credential Access
                  score: 0.97
                - event_id: "Failed password f"
                  timestamp: "2024-01-14T08:12:44Z"
                  source: syslog
                  attack_type: Brute Force
                  severity: P2
                  summary: SSH brute force attempt targeting root account from 203.0.113.5.
                  mitre_tactic: Credential Access
                  score: 0.91
        "400":
          description: Missing required query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "q parameter is required"
        "500":
          description: Embedding or vector search failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                embed_failed:
                  summary: Ollama embedding call failed
                  value:
                    error: "embedding failed"
                search_failed:
                  summary: Qdrant search call failed
                  value:
                    error: "search failed"
        "503":
          description: Semantic search not configured (Qdrant/Ollama not available)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "semantic search not configured (Qdrant/Ollama not available)"

  # ── Events and detection ──────────────────────────────────────────────────────

  /api/events:
    get:
      tags: [Events]
      summary: Recent classified events
      description: Most recent stored events, newest first. With Postgres this includes history from before the last restart.
      operationId: listEvents
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ClassifiedEvent"}
        "400":
          description: limit out of range
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationError"}

  /api/detections/rules:
    get:
      tags: [Detection]
      summary: Loaded detection rules
      description: |
        Sigma rules loaded at start (the built-in pack plus `SIGMA_RULES_DIR`),
        with how many events each has matched since the server started.
      operationId: listDetectionRules
      responses:
        "200":
          description: Rules sorted by title
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/DetectionRule"}

  /api/detections/rules/{id}:
    patch:
      tags: [Detection]
      summary: Enable or disable a detection rule
      description: |
        Takes effect immediately and is saved (in Postgres when configured),
        so it survives restarts. Disabling a threshold rule clears its counters.
      operationId: updateDetectionRule
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200":
          description: The updated rule
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DetectionRule"}
        "400": {description: "Body is not {\"enabled\": true|false}"}
        "404": {description: Unknown rule, or detection is off}

  # ── Incidents ─────────────────────────────────────────────────────────────────

  /api/incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      description: Most recently active first. Alerts sharing an IP, user or host within INCIDENT_WINDOW are grouped into one incident.
      operationId: listIncidents
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [new, investigating, resolved]}}
        - {name: severity, in: query, schema: {type: string, enum: [P1, P2, P3, P4, P5]}}
        - {name: assignee, in: query, schema: {type: string}}
        - name: entity
          in: query
          description: Only incidents involving this entity
          schema: {type: string, example: "ip:203.0.113.7"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Incident"}
        "400": {description: Invalid entity or limit}
        "404": {description: Incidents are not enabled}

  /api/incidents/stats:
    get:
      tags: [Incidents]
      summary: Incident queue metrics
      operationId: getIncidentStats
      responses:
        "200":
          description: Counts and mean time to resolve
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IncidentStats"}

  /api/incidents/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, example: INC-2EA4C98D}}
    get:
      tags: [Incidents]
      summary: Incident with alerts and history
      operationId: getIncident
      responses:
        "200":
          description: The incident
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IncidentDetail"}
        "404": {description: Unknown incident}
    patch:
      tags: [Incidents]
      summary: Update status, assignee, severity or resolution
      description: Every changed field is recorded in the incident history. A resolution needs status resolved; reopening clears it.
      operationId: updateIncident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string, enum: [new, investigating, resolved]}
                assignee: {type: string, maxLength: 100}
                severity: {type: string, enum: [P1, P2, P3, P4, P5]}
                resolution: {type: string, enum: ["", true_positive, false_positive, benign, duplicate]}
      responses:
        "200":
          description: The updated incident
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incident"}
        "400": {description: Invalid change}
        "404": {description: Unknown incident}

  /api/incidents/{id}/comments:
    post:
      tags: [Incidents]
      summary: Add a comment
      operationId: addIncidentComment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, maxLength: 5000}
      responses:
        "201":
          description: The recorded comment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IncidentActivity"}
        "400": {description: Empty or too long}
        "404": {description: Unknown incident}

  /api/incidents/{id}/investigate:
    post:
      tags: [Incidents]
      summary: Run an AI investigation of the whole incident
      description: |
        Runs in the background; the write-up streams over /ws/alerts and is
        saved to the incident history as an "investigation" entry.
      operationId: investigateIncident
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "202": {description: Started}
        "404": {description: Unknown incident}
        "409": {description: An investigation is already running for this incident}
        "429": {description: Too many investigations in flight; retry later}
        "503": {description: No LLM agent configured}

  /api/incidents/{id}/report:
    get:
      tags: [Incidents]
      summary: Markdown incident report
      operationId: getIncidentReport
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: download, in: query, description: Serve as an attachment, schema: {type: string, example: "1"}}
      responses:
        "200":
          description: The report
          content:
            text/markdown:
              schema: {type: string}
        "404": {description: Unknown incident}

  /api/incidents/{id}/feedback:
    post:
      tags: [Incidents]
      summary: Rate the latest AI investigation
      operationId: rateIncidentInvestigation
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [helpful]
              properties:
                helpful: {type: boolean}
                note: {type: string, maxLength: 5000}
      responses:
        "201":
          description: The recorded rating
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IncidentActivity"}
        "400": {description: No investigation to rate, or invalid body}
        "404": {description: Unknown incident}

  /api/incidents/{id}/playbooks/{playbook}/run:
    post:
      tags: [Response]
      summary: Propose a playbook's actions for an incident
      description: Ignores the playbook's trigger; its mode (approval, dry_run, auto) still applies. Already-proposed actions are not repeated.
      operationId: runPlaybook
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: playbook, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Newly proposed actions (may be empty)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ResponseAction"}
        "404": {description: Unknown incident}
        "409": {description: Unknown playbook}

  # ── Response ──────────────────────────────────────────────────────────────────

  /api/playbooks:
    get:
      tags: [Response]
      summary: Loaded playbooks
      operationId: listPlaybooks
      responses:
        "200":
          description: Playbooks sorted by name
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Playbook"}

  /api/suppressions:
    get:
      tags: [Incidents]
      summary: List suppressions
      description: Active and expired suppressions, newest first. Hit counts are since the server started.
      operationId: listSuppressions
      responses:
        "200":
          description: Suppressions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Suppression"}
    post:
      tags: [Incidents]
      summary: Snooze alerts (analyst)
      description: |
        Matching events are stored, marked `suppressed_by`, but open or join no
        incident, run no playbook and start no AI investigation. Set at least
        one of entity, rule_id and attack_type; all that are set must match.
      operationId: createSuppression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                entity: {type: string, example: "ip:203.0.113.9"}
                rule_id: {type: string}
                attack_type: {type: string}
                reason: {type: string, maxLength: 500}
                duration: {type: string, description: "1m to 2160h; empty lasts until lifted", example: "24h"}
                incident_id: {type: string, description: Note the snooze on this incident's timeline}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Suppression"}
        "400": {description: Invalid suppression}

  /api/suppressions/{id}:
    delete:
      tags: [Incidents]
      summary: Lift a suppression (analyst)
      operationId: liftSuppression
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Lifted}
        "404": {description: Not found}

  /api/response/actions:
    get:
      tags: [Response]
      summary: Response actions, newest first
      operationId: listResponseActions
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, dry_run, running, succeeded, failed, rejected]}}
        - {name: incident, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
      responses:
        "200":
          description: Actions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ResponseAction"}

  /api/response/actions/{id}/approve:
    post:
      tags: [Response]
      summary: Approve and run a pending action
      operationId: approveResponseAction
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The action in its final state (succeeded or failed)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResponseAction"}
        "404": {description: Unknown action}
        "409": {description: The action is not pending}

  /api/response/actions/{id}/reject:
    post:
      tags: [Response]
      summary: Reject a pending action
      operationId: rejectResponseAction
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 1000}
      responses:
        "200":
          description: The rejected action
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResponseAction"}
        "404": {description: Unknown action}
        "409": {description: The action is not pending}

  # ── Accounts ──────────────────────────────────────────────────────────────────

  /api/auth/login:
    post:
      tags: [Accounts]
      summary: Sign in
      description: Public. Sets an HttpOnly, SameSite=Strict session cookie. Cookie-authenticated writes must send X-Requested-With.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Principal"}
        "401": {description: Invalid username or password}
        "429": {description: Too many failed logins for this username}

  /api/auth/logout:
    post:
      tags: [Accounts]
      summary: Sign out
      operationId: logout
      responses:
        "204": {description: Signed out}

  /api/auth/me:
    get:
      tags: [Accounts]
      summary: Who am I
      operationId: getMe
      responses:
        "200":
          description: The caller and their permissions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Principal"}
        "401": {description: Not signed in; login_required tells the dashboard to show the login form}

  /api/auth/password:
    post:
      tags: [Accounts]
      summary: Change your own password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, format: password}
                new_password: {type: string, format: password, minLength: 12, maxLength: 72}
      responses:
        "204": {description: Changed}
        "400": {description: Wrong current password or weak new password}

  /api/users:
    get:
      tags: [Accounts]
      summary: List users (admin)
      operationId: listUsers
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/User"}
        "403": {description: Not an admin}
    post:
      tags: [Accounts]
      summary: Add a user (admin)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: {type: string}
                display_name: {type: string}
                password: {type: string, format: password, minLength: 12, maxLength: 72}
                role: {type: string, enum: [viewer, analyst, admin]}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {description: Invalid or taken username, weak password, unknown role}

  /api/users/{id}:
    patch:
      tags: [Accounts]
      summary: Change a user (admin)
      description: Disabling or resetting a password ends the user's sessions. The last active admin cannot be demoted or disabled.
      operationId: updateUser
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string}
                role: {type: string, enum: [viewer, analyst, admin]}
                disabled: {type: boolean}
                password: {type: string, format: password}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {description: Invalid change}
        "404": {description: Unknown user}

  /api/audit:
    get:
      tags: [Accounts]
      summary: Audit log (admin)
      operationId: listAudit
      parameters:
        - {name: actor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
      responses:
        "200":
          description: Entries, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AuditEntry"}

  /api/retention:
    get:
      tags: [Accounts]
      summary: Data retention policy and last purge (admin)
      description: |
        Set with RETENTION_EVENTS_DAYS, RETENTION_INCIDENTS_DAYS and
        RETENTION_AUDIT_DAYS (0 keeps data forever). Purges run hourly and only
        with Postgres; `active` is false without it.
      operationId: getRetention
      responses:
        "200":
          description: Policy and the most recent run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RetentionStatus"}

  # ── Analytics ─────────────────────────────────────────────────────────────────

  /api/analytics/summary:
    get:
      tags: [Analytics]
      summary: In-memory event analytics
      description: |
        Returns aggregated statistics over the last 1 000 classified events held
        in the server's ring buffer.

        - **attack_type_counts** — event count per attack type with highest severity seen
        - **timeline** — 36 × 10-minute buckets covering the last 6 hours (P1/P2/P3 counts)
        - **mitre_tactics** — MITRE ATT&CK tactic distribution
      operationId: getAnalyticsSummary
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
              example:
                total_events: 142
                attack_type_counts:
                  Brute Force:
                    count: 87
                    severity: P2
                  Port Scan:
                    count: 31
                    severity: P4
                  SQL Injection:
                    count: 14
                    severity: P2
                  Benign:
                    count: 10
                    severity: P5
                timeline:
                  - time: "10:00"
                    counts: {P1: 0, P2: 3, P3: 7}
                  - time: "10:10"
                    counts: {P1: 1, P2: 5, P3: 4}
                  - time: "10:20"
                    counts: {P1: 0, P2: 2, P3: 9}
                mitre_tactics:
                  "Credential Access": 87
                  "Discovery": 31
                  "Initial Access": 14

  # ── Observability ─────────────────────────────────────────────────────────────

  /metrics:
    get:
      tags: [Observability]
      summary: Prometheus metrics
      description: |
        Exposes the following custom metrics in addition to standard Go runtime metrics.

        | Metric | Type | Labels |
        |--------|------|--------|
        | `events_classified_total` | counter | `severity`, `attack_type` |
        | `classification_duration_seconds` | histogram | — |
        | `llm_stream_errors_total` | counter | — |
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text format
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP events_classified_total Total number of events classified
                # TYPE events_classified_total counter
                events_classified_total{attack_type="Brute Force",severity="P2"} 87
                # HELP classification_duration_seconds Time spent on LLM classification
                # TYPE classification_duration_seconds histogram
                classification_duration_seconds_bucket{le="0.1"} 0
                classification_duration_seconds_bucket{le="0.5"} 12
                classification_duration_seconds_bucket{le="1"} 54
                classification_duration_seconds_bucket{le="2"} 87
                classification_duration_seconds_bucket{le="+Inf"} 87
                classification_duration_seconds_sum 63.4
                classification_duration_seconds_count 87

# ── Reusable Components ───────────────────────────────────────────────────────

components:
  schemas:
    Principal:
      type: object
      properties:
        username: {type: string}
        role: {type: string, enum: [viewer, analyst, admin]}
        auth: {type: string, enum: [session, api_key, open]}
        id: {type: string}
        permissions:
          type: object
          properties:
            read: {type: boolean}
            write: {type: boolean}
            admin: {type: boolean}

    User:
      type: object
      properties:
        id: {type: string}
        username: {type: string}
        display_name: {type: string}
        role: {type: string, enum: [viewer, analyst, admin]}
        disabled: {type: boolean}
        created_at: {type: string, format: date-time}
        last_login_at: {type: string, format: date-time}

    Suppression:
      type: object
      properties:
        id: {type: string, example: SUP-1A2B3C4D}
        entity:
          type: object
          properties:
            kind: {type: string, enum: [ip, user, host]}
            value: {type: string}
        rule_id: {type: string}
        attack_type: {type: string}
        reason: {type: string}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: Absent when it lasts until lifted}
        hits: {type: integer, description: Matches since the server started}
        last_hit: {type: string, format: date-time}

    RetentionStatus:
      type: object
      required: [active, events_days, incidents_days, audit_days, last_run]
      properties:
        active: {type: boolean, description: false without Postgres}
        events_days: {type: integer, description: 0 keeps forever}
        incidents_days: {type: integer, description: Resolved incidents; 0 keeps forever}
        audit_days: {type: integer, description: 0 keeps forever}
        interval_seconds: {type: integer}
        last_run:
          nullable: true
          type: object
          properties:
            at: {type: string, format: date-time}
            deleted:
              type: object
              description: Rows removed per kind (events, incidents, audit, sessions)
              additionalProperties: {type: integer}
            errors:
              type: object
              additionalProperties: {type: string}

    AuditEntry:
      type: object
      properties:
        id: {type: integer}
        at: {type: string, format: date-time}
        actor: {type: string}
        action: {type: string, example: "PATCH /api/incidents/{id}"}
        target: {type: string}
        status: {type: integer}
        ip: {type: string}

    ResponseAction:
      type: object
      properties:
        id: {type: string, example: ACT-ED461BC5}
        incident_id: {type: string}
        playbook_id: {type: string}
        playbook_name: {type: string}
        type: {type: string, enum: [block_ip, disable_user, isolate_host, notify, webhook]}
        target: {type: string, example: 185.220.101.77}
        message: {type: string}
        step: {type: integer}
        status: {type: string, enum: [pending, dry_run, running, succeeded, failed, rejected]}
        reason: {type: string}
        result: {type: string}
        proposed_at: {type: string, format: date-time}
        decided_by: {type: string}
        decided_at: {type: string, format: date-time}
        executed_at: {type: string, format: date-time}

    Playbook:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        mode: {type: string, enum: [approval, dry_run, auto]}
        enabled: {type: boolean}
        source: {type: string}
        trigger:
          type: object
          properties:
            min_severity: {type: string}
            tactics: {type: array, items: {type: string}}
            techniques: {type: array, items: {type: string}}
            attack_types: {type: array, items: {type: string}}
        actions:
          type: array
          items:
            type: object
            properties:
              type: {type: string}
              message: {type: string}

    Entity:
      type: object
      properties:
        kind: {type: string, enum: [ip, user, host, signature]}
        value: {type: string}

    Incident:
      type: object
      properties:
        id: {type: string, example: INC-2EA4C98D}
        title: {type: string, example: "SSH Brute Force from 185.220.101.77"}
        severity: {type: string, enum: [P1, P2, P3, P4, P5]}
        status: {type: string, enum: [new, investigating, resolved]}
        resolution: {type: string, enum: [true_positive, false_positive, benign, duplicate]}
        assignee: {type: string}
        entities:
          type: array
          items: {$ref: "#/components/schemas/Entity"}
        tactics:
          type: array
          items: {type: string}
          description: ATT&CK tactics reached, in matrix order
        techniques:
          type: array
          items: {type: string}
        alert_count: {type: integer}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time}

    IncidentAlert:
      type: object
      properties:
        id: {type: integer}
        incident_id: {type: string}
        at: {type: string, format: date-time}
        severity: {type: string}
        attack_type: {type: string}
        summary: {type: string}
        tactic: {type: string}
        technique_id: {type: string}
        rules:
          type: array
          items: {type: string}
        hostname: {type: string}
        raw: {type: string}
        entities:
          type: array
          items: {$ref: "#/components/schemas/Entity"}

    IncidentActivity:
      type: object
      properties:
        id: {type: integer}
        incident_id: {type: string}
        at: {type: string, format: date-time}
        actor: {type: string, example: analyst}
        kind: {type: string, enum: [created, escalated, status, assignee, severity, resolution, comment, investigation, feedback, response]}
        body: {type: string}

    IncidentDetail:
      allOf:
        - $ref: "#/components/schemas/Incident"
        - type: object
          properties:
            alerts:
              type: array
              items: {$ref: "#/components/schemas/IncidentAlert"}
            activity:
              type: array
              items: {$ref: "#/components/schemas/IncidentActivity"}

    IncidentStats:
      type: object
      properties:
        open: {type: integer}
        by_status:
          type: object
          additionalProperties: {type: integer}
        open_by_severity:
          type: object
          additionalProperties: {type: integer}
        resolved: {type: integer}
        false_positive: {type: integer}
        mttr_seconds: {type: number, description: Mean time from creation to resolution}
    Severity:
      type: string
      enum: [P1, P2, P3, P4, P5]
      description: |
        P1=Critical, P2=High, P3=Medium, P4=Low, P5=Info

    LogEvent:
      type: object
      required: [raw, message, source]
      properties:
        raw:
          type: string
          description: Original unparsed log line
          example: "<165>1 2024-01-15T10:30:00Z webserver sshd 1234 - Failed password for root from 192.168.1.100 port 22"
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        hostname:
          type: string
          example: webserver
        app_name:
          type: string
          example: sshd
        proc_id:
          type: string
          example: "1234"
        message:
          type: string
          example: "Failed password for root from 192.168.1.100 port 22"
        source:
          type: string
          enum: [syslog, json, raw]
          example: syslog

    MITREInfo:
      type: object
      required: [tactic, technique_id, technique]
      properties:
        tactic:
          type: string
          example: "Credential Access"
        technique_id:
          type: string
          example: "T1110.001"
        technique:
          type: string
          example: "Password Guessing"

    ClassifiedEvent:
      type: object
      required: [event, attack_type, mitre, severity, confidence, iocs, summary, remediation, processed_at]
      properties:
        event:
          $ref: "#/components/schemas/LogEvent"
        attack_type:
          type: string
          example: "Brute Force"
        mitre:
          $ref: "#/components/schemas/MITREInfo"
        severity:
          $ref: "#/components/schemas/Severity"
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.95
        iocs:
          type: array
          items:
            type: string
          description: Indicators of compromise extracted from the log
          example: ["192.168.1.100", "root"]
        summary:
          type: string
          example: "Multiple failed SSH login attempts from 192.168.1.100."
        remediation:
          type: string
          example: "Block the source IP and rotate account credentials. Enable fail2ban."
        processed_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:01Z"
        detections:
          type: array
          description: Detection rules that matched the event.
          items: {$ref: "#/components/schemas/Detection"}
        classified_by:
          type: string
          enum: [rules, llm, llm+rules]
          description: What produced the verdict.
        suppressed_by:
          type: string
          description: ID of the suppression that matched; the event opened no incident.
          example: SUP-1A2B3C4D

    Detection:
      type: object
      required: [rule_id, title, level]
      properties:
        rule_id: {type: string, example: "cd2cd99d-a2e1-4871-8eed-a9f2918b699a"}
        title: {type: string, example: "Shadow Copies Deleted"}
        level: {type: string, enum: [informational, low, medium, high, critical]}
        tags:
          type: array
          items: {type: string}
          example: ["attack.impact", "attack.t1490"]
        count: {type: integer, description: "Threshold rules: events that crossed the threshold"}
        group: {type: string, example: "src_ip=203.0.113.7", description: "Threshold rules: the shared group-by value"}
        threshold: {type: string, example: "count() by src_ip >= 10 in 5m"}

    DetectionRule:
      type: object
      required: [id, title, level, source, hits, enabled, type]
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: string}
        level: {type: string, enum: [informational, low, medium, high, critical]}
        status: {type: string, example: stable}
        tags:
          type: array
          items: {type: string}
        source: {type: string, description: '"builtin" or the rule file path'}
        hits: {type: integer, format: int64, description: "Times fired since server start (threshold crossings for threshold rules)"}
        enabled: {type: boolean}
        type: {type: string, enum: [single, threshold]}
        threshold: {type: string, example: "count() by src_ip >= 10 in 5m"}

    ClassifyRequest:
      type: object
      required: [log]
      properties:
        log:
          type: string
          maxLength: 8192
          description: Raw log line to classify
          example: "<165>1 2024-01-15T10:30:00Z webserver sshd 1234 - Failed password for root from 192.168.1.100 port 22"
        format:
          type: string
          enum: [syslog, json, auto]
          default: auto
          description: Hint for the parser; `auto` tries all formats in order

    ValidationError:
      type: object
      required: [error, field]
      properties:
        error:
          type: string
          example: "log field must not exceed 8192 bytes"
        field:
          type: string
          example: log

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "semantic search not configured"

    HealthOK:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    HealthReady:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, "not ready"]
        checks:
          type: object
          additionalProperties:
            type: string
          example:
            llm: ok
            qdrant: ok

    IngestRequest:
      type: object
      required: [logs]
      properties:
        logs:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 500
          description: Raw log lines to classify
        format:
          type: string
          enum: [syslog, json, auto]
          default: auto

    IngestResponse:
      type: object
      required: [accepted, classified, errors, results]
      properties:
        accepted:
          type: integer
          description: Number of lines successfully parsed
          example: 47
        classified:
          type: integer
          description: Number of lines successfully classified by LLM
          example: 45
        errors:
          type: integer
          description: Number of classification failures
          example: 2
        results:
          type: array
          items:
            $ref: "#/components/schemas/ClassifiedEvent"

    SearchHit:
      type: object
      required: [event_id, timestamp, source, attack_type, severity, summary, mitre_tactic, score]
      properties:
        event_id:
          type: string
          example: "Failed password f"
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T10:30:01Z"
        source:
          type: string
          enum: [syslog, json, raw]
          example: syslog
        attack_type:
          type: string
          example: "Brute Force"
        severity:
          $ref: "#/components/schemas/Severity"
        summary:
          type: string
          example: "Multiple failed SSH login attempts from 192.168.1.100."
        mitre_tactic:
          type: string
          example: "Credential Access"
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Cosine similarity score (1.0 = perfect match)
          example: 0.97

    AttackCount:
      type: object
      required: [count, severity]
      properties:
        count:
          type: integer
          example: 87
        severity:
          $ref: "#/components/schemas/Severity"

    TimelineBucket:
      type: object
      required: [time, counts]
      properties:
        time:
          type: string
          description: Bucket start time formatted as HH:MM (UTC)
          example: "10:30"
        counts:
          type: object
          additionalProperties:
            type: integer
          description: Event count per severity (P1, P2, P3)
          example:
            P1: 1
            P2: 5
            P3: 4

    AnalyticsSummary:
      type: object
      required: [total_events, attack_type_counts, timeline, mitre_tactics]
      properties:
        total_events:
          type: integer
          description: Number of events currently in the ring buffer (max 1000)
          example: 142
        attack_type_counts:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AttackCount"
        timeline:
          type: array
          description: 36 × 10-minute buckets covering the last 6 hours
          items:
            $ref: "#/components/schemas/TimelineBucket"
        mitre_tactics:
          type: object
          additionalProperties:
            type: integer
          description: Event count per MITRE ATT&CK tactic
          example:
            "Credential Access": 87
            "Discovery": 31

  requestBodies:
    ClassifyRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClassifyRequest"
          examples:
            syslog_rfc5424:
              summary: RFC 5424 syslog — SSH brute force
              value:
                log: "<165>1 2024-01-15T10:30:00Z webserver sshd 1234 - Failed password for root from 192.168.1.100 port 22"
                format: syslog
            syslog_rfc3164:
              summary: RFC 3164 (BSD) syslog — sudo privilege escalation
              value:
                log: "<85>Jan 15 10:30:00 appserver sudo: user1 : TTY=pts/0 ; PWD=/root ; USER=root ; COMMAND=/bin/bash"
                format: syslog
            json_log:
              summary: JSON log — failed authentication
              value:
                log: '{"level":"error","msg":"authentication failed","time":"2024-01-15T10:30:00Z","hostname":"auth-01","user":"admin","ip":"203.0.113.5"}'
                format: json
            raw_log:
              summary: Raw unstructured log
              value:
                log: "Jan 15 10:30:00 KERNEL: UFW BLOCK IN=eth0 OUT= SRC=10.0.0.1 DST=192.168.1.1 PROTO=TCP DPT=22"
                format: auto
            benign_log:
              summary: Benign cron job log
              value:
                log: "<13>1 2024-01-15T10:30:00Z server cron 8742 - (root) CMD (/usr/bin/certbot renew --quiet)"
                format: auto

  responses:
    ClassifiedEvent:
      description: Successful classification result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClassifiedEvent"
          examples:
            brute_force:
              summary: SSH brute force — P2 High
              value:
                attack_type: Brute Force
                severity: P2
                confidence: 0.95
                iocs: ["192.168.1.100", "root"]
                summary: "Multiple failed SSH login attempts from 192.168.1.100 targeting root."
                remediation: "Block 192.168.1.100 at the firewall. Enable fail2ban on the SSH port. Rotate root credentials."
                mitre:
                  tactic: Credential Access
                  technique_id: T1110.001
                  technique: Password Guessing
                event:
                  raw: "<165>1 2024-01-15T10:30:00Z webserver sshd 1234 - Failed password for root from 192.168.1.100 port 22"
                  timestamp: "2024-01-15T10:30:00Z"
                  hostname: webserver
                  app_name: sshd
                  proc_id: "1234"
                  message: "Failed password for root from 192.168.1.100 port 22"
                  source: syslog
                processed_at: "2024-01-15T10:30:01Z"
            sql_injection:
              summary: SQL injection attempt — P2 High
              value:
                attack_type: SQL Injection
                severity: P2
                confidence: 0.91
