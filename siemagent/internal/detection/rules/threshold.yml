title: Port Scan From One Source
id: 9c4f1e2d-7b3a-4e8f-a6d5-2b1c0e9f8a77
status: test
description: Blocked connections from one source IP reached ten or more different destination ports within a minute.
author: siemagent contributors
tags:
  - attack.discovery
  - attack.t1046
logsource:
  category: firewall
detection:
  selection:
    message|contains:
      - 'BLOCK'
      - 'DROP'
      - 'DENY'
  timeframe: 1m
  condition: selection | count(dst_port) by src_ip >= 10
falsepositives:
  - Vulnerability scanners run by your own team
level: medium
remediation: Confirm whether the source is an authorised scanner; if not, block it and check exposed services for follow-up exploitation.
samples:
  match:
    - 'Oct 11 22:14:15 fw01 kernel: [UFW BLOCK] IN=eth0 OUT= SRC=203.0.113.50 DST=10.0.0.5 PROTO=TCP SPT=40000 DPT=21 WINDOW=1024'
