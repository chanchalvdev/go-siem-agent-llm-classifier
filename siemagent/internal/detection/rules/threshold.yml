title: Web Content Discovery Scan
id: 3a8e7c55-91f2-4c1a-b0de-7e2d4c6a9b18
status: test
description: One client received fifteen or more 404 responses within a minute, typical of directory brute-forcing tools such as gobuster or dirb.
author: siemagent contributors
tags:
  - attack.reconnaissance
  - attack.t1595.003
logsource:
  category: webserver
detection:
  selection:
    message|re: '"\s404\s'
  timeframe: 1m
  condition: selection | count() by src_ip >= 15
falsepositives:
  - Broken links crawled by a search engine
  - Uptime monitors checking a removed page
level: medium
remediation: Rate-limit or block the client at the WAF and confirm none of the probed paths exist and return data.
samples:
  match:
    - '198.51.100.23 - - [11/Oct/2026:22:14:15 +0000] "GET /admin HTTP/1.1" 404 153 "-" "Mozilla/5.0"'
