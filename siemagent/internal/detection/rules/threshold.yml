title: Password Spraying
id: 6d1b9b6e-2b1d-4a59-8f62-5a0f0c7e3d42
status: test
description: One source IP failed to log in as five or more different users within ten minutes, a password-spraying pattern that stays under per-account lockouts.
author: siemagent contributors
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  product: linux
  service: sshd
detection:
  selection:
    - 'Failed password for'
    - 'Invalid user'
  timeframe: 10m
  condition: selection | count(user) by src_ip >= 5
falsepositives:
  - Jump hosts or NAT gateways shared by many users
level: high
remediation: Block the source, check every targeted account for a successful login afterwards, and require MFA for remote access.
samples:
  match:
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for admin from 45.33.32.156 port 50000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for oracle from 45.33.32.156 port 50000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for postgres from 45.33.32.156 port 50000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for ubuntu from 45.33.32.156 port 50000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for test from 45.33.32.156 port 50000 ssh2'
  no_match:
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 45.33.32.156 port 50000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 45.33.32.156 port 50000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 45.33.32.156 port 50000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 45.33.32.156 port 50000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 45.33.32.156 port 50000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 45.33.32.156 port 50000 ssh2'
