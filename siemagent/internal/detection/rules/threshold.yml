title: SSH Brute Force
id: 0f6c2a4e-6a43-4a0e-9a5d-1f3f8f5b2c11
status: stable
description: Ten or more failed SSH logins from one source IP within five minutes, the signature of password guessing.
author: siemagent contributors
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  product: linux
  service: sshd
detection:
  selection:
    - 'Failed password for'
    - 'authentication failure'
  timeframe: 5m
  condition: selection | count() by src_ip >= 10
falsepositives:
  - A misconfigured script retrying with an old password
level: high
remediation: Block the source IP at the firewall, check for a later successful login from it, and enforce key-based SSH with fail2ban.
samples:
  match:
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 185.220.101.4 port 52000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 185.220.101.4 port 52001 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 185.220.101.4 port 52002 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 185.220.101.4 port 52003 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 185.220.101.4 port 52004 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 185.220.101.4 port 52005 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 185.220.101.4 port 52006 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 185.220.101.4 port 52007 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 185.220.101.4 port 52008 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 185.220.101.4 port 52009 ssh2'
  no_match:
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 10.0.0.1 port 50000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 10.0.0.2 port 50000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 10.0.0.3 port 50000 ssh2'
    - 'Oct 11 22:14:15 web01 sshd[4721]: Failed password for root from 10.0.0.4 port 50000 ssh2'
