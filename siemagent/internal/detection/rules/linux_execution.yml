title: Shell History or System Logs Cleared
id: 5ee6b40f-f6c1-4f47-958a-ff7eb41adb46
status: test
description: Shell history or system logs were deleted, which attackers do to hide their tracks.
author: siemagent contributors
tags:
  - attack.defense_evasion
  - attack.t1070
logsource:
  product: linux
detection:
  selection:
    message|contains:
      - 'history -c'
      - 'rm -rf /var/log'
      - 'rm /var/log/'
      - 'truncate -s 0 /var/log'
      - '> ~/.bash_history'
      - 'unset HISTFILE'
      - 'wevtutil cl'
  condition: selection
falsepositives:
  - Log rotation scripts (these normally use logrotate, not rm)
level: high
remediation: Preserve remaining evidence, check central log copies for the missing period, and investigate the account.
samples:
  match:
    - '<34>1 2026-10-03T10:50:00Z app01 bash 1 - root: history -c && rm -rf /var/log/auth.log'
  no_match:
    - '<34>1 2026-10-03T10:50:00Z app01 logrotate 1 - rotating /var/log/syslog'
